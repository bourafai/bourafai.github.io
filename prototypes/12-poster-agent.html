<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aymene Bourafai</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..900&family=Martian+Mono:wdth,wght@75..112.5,400..600&display=swap">
  <style>
    :root { --paper: #eceeea; --ink: #10233a; --teal: #0f5c6e; --cyan: #5fd4e2; --hot: #c2185b; --disc: var(--teal); }
    * { box-sizing: border-box; }
    html { background: var(--paper); color: var(--ink); }
    body { margin: 0; height: 100svh; display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(6, minmax(0, 1fr)) auto; gap: 16px; padding: clamp(1rem, 3vw, 2.5rem); padding-bottom: 4.5rem; font: 500 1rem/1.4 "Schibsted Grotesk", system-ui, sans-serif; }
    body > :is(h1, p, div, nav) { margin: 0; }
    .name { grid-column: 1; grid-row: 1 / 7; writing-mode: vertical-rl; rotate: 180deg; font-size: min(7.5rem, calc((100svh - 12rem) / 9.5)); font-weight: 900; white-space: nowrap; line-height: .85; letter-spacing: -.03em; view-transition-name: name; }
    .disc { grid-column: 3 / 6; grid-row: 1 / 4; align-self: center; justify-self: center; height: min(100%, 22rem); max-width: 100%; aspect-ratio: 1; border-radius: 50%; background: var(--disc); view-transition-name: disc; }
    .bar { grid-column: 2 / 7; grid-row: 4; align-self: start; height: 1rem; background: var(--ink); view-transition-name: bar; }
    .role { grid-column: 2 / 4; grid-row: 5; font-size: clamp(1.25rem, 2.5vw, 2rem); font-weight: 800; line-height: 1.05; view-transition-name: role; }
    .about { grid-column: 4 / 6; grid-row: 5 / 7; max-width: 30ch; view-transition-name: about; }
    nav { grid-column: 6; grid-row: 5 / 7; display: flex; flex-direction: column; gap: .25rem; view-transition-name: links; }
    nav a { align-self: start; color: inherit; font-weight: 800; text-decoration: none; border-bottom: 3px solid var(--teal); }
    nav a:hover, nav a:focus-visible { background: var(--cyan); outline: none; }
    ::view-transition-group(*) { animation-duration: .7s; animation-timing-function: cubic-bezier(.2, .7, 0, 1); }

    /* The agent: a command line in the poster's last grid row. */
    .agent { grid-column: 2 / 7; grid-row: 7; margin-top: 1rem; font: 400 13px/1.6 "Martian Mono", ui-monospace, monospace; font-stretch: 87.5%; }
    .agent output { display: block; min-height: 1.6em; margin-bottom: .5rem; white-space: pre-wrap; }
    .agent output b { color: var(--hot); font-weight: 600; }
    .agent output a { color: inherit; text-decoration-color: var(--teal); }
    .agent form { display: flex; gap: 1ch; padding: .6rem .9rem; background: var(--ink); color: var(--paper); }
    .agent label { color: var(--cyan); }
    .agent input { flex: 1; min-width: 0; border: 0; background: none; padding: 0; font: inherit; color: inherit; caret-color: var(--cyan); outline: none; }
    .agent input::placeholder { color: #8fa3b3; }
    .agent form:focus-within { outline: 2px solid var(--cyan); outline-offset: 2px; }

    @media (max-width: 48rem) {
      body { height: auto; min-height: 100svh; grid-template-columns: auto 1fr; grid-template-rows: auto; }
      .name { grid-column: 1; grid-row: 1 / 7; font-size: 3.5rem; }
      .disc, .bar, .role, .about, nav, .agent { grid-column: 2 !important; grid-row: auto !important; }
    }
  </style>
</head>
<body>
  <h1 class="name">Aymene Bourafai</h1>
  <div class="disc" aria-hidden="true"></div>
  <div class="bar" aria-hidden="true"></div>
  <p class="role">Product engineer, frontend-focused</p>
  <p class="about">Graphic designer turned developer. I now design how developers and AI agents work together.</p>
  <nav aria-label="Elsewhere">
    <a href="#">Writing</a>
    <a href="https://github.com/bourafai">GitHub</a>
    <a href="https://www.linkedin.com/in/bourafai">LinkedIn</a>
  </nav>
  <section class="agent" aria-label="Agent">
    <output aria-live="polite"><b>agent ›</b> An AI agent designed this poster. Ask me to redesign it. Or press space.</output>
    <form>
      <label for="q">›</label>
      <input id="q" autocomplete="off" spellcheck="false" placeholder="redesign it · show the grid · early designs · secret">
    </form>
  </section>
  <script src="eggs.js"></script>
  <script>
    Eggs.options.columns = 6;
    Eggs.options.fall = '.name, .disc, .bar, .role, .about, nav';
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const parts = ['.disc', '.bar', '.role', '.about'].map((s) => document.querySelector(s));
    const DISCS = ['#0f5c6e', '#5fd4e2', '#10233a', '#c2185b'];
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const span = (start, max, end) => `${start} / ${Math.min(end, start + 1 + Math.floor(Math.random() * max))}`;

    // The 9-poster egg, now driven by the agent: recompose places each block on a new spot of the 6x6 grid.
    function recompose() {
      const [disc, bar, role, about] = parts;
      // Decorative blocks go anywhere; text stays out of the links column (6) and on separate rows.
      for (const el of [disc, bar]) {
        el.style.gridColumn = span(2 + Math.floor(Math.random() * 4), 3, 7);
        el.style.gridRow = span(1 + Math.floor(Math.random() * 5), 2, 7);
      }
      const top = Math.random() < .5;
      role.style.gridColumn = span(2 + Math.floor(Math.random() * 3), 1, 6);
      role.style.gridRow = String((top ? 1 : 4) + Math.floor(Math.random() * 3));
      about.style.gridColumn = span(2 + Math.floor(Math.random() * 3), 1, 6);
      about.style.gridRow = String((top ? 4 : 1) + Math.floor(Math.random() * 2));
      document.body.style.setProperty('--disc', pick(DISCS));
      document.querySelector('.bar').style.height = `${pick([4, 16, 32])}px`;
    }
    Eggs.on('recompose', () => {
      if (innerWidth < 768) return;
      document.startViewTransition && !reduced ? document.startViewTransition(recompose) : recompose();
    });

    const output = document.querySelector('.agent output');
    const input = document.getElementById('q');
    document.querySelector('.agent form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!input.value.trim()) return;
      const answer = Eggs.reply(input.value);
      if (answer) output.innerHTML = `<b>agent ›</b> ${answer}`;
      input.value = '';
    });
    addEventListener('keydown', (e) => {
      if (e.code !== 'Space' || e.target.closest('input, button, a')) return;
      e.preventDefault();
      output.innerHTML = `<b>agent ›</b> ${Eggs.reply('redesign')}`;
    });
  </script>
  <script src="switcher.js"></script>
</body>
</html>
