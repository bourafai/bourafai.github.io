<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aymene Bourafai</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans:wght@400;500&display=swap">
  <style>
    :root { --navy: #10233a; --fog: #e6ecef; --cyan: #5fd4e2; --dim: #8fa3b3; --r: min(38vmin, 20rem); }
    * { box-sizing: border-box; }
    html { background: var(--navy); color: var(--fog); }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; overflow: hidden; font: 400 1rem/1.5 "IBM Plex Sans", system-ui, sans-serif; }
    .system { position: relative; width: calc(var(--r) * 2); aspect-ratio: 1; display: grid; place-items: center; }
    .ring { position: absolute; inset: 0; border: 1px solid rgba(95, 212, 226, .25); border-radius: 50%; }
    .ring + .ring { inset: 18%; border-style: dashed; border-color: rgba(230, 236, 239, .12); }
    .core { text-align: center; max-width: 16rem; }
    h1 { margin: 0; font: 400 clamp(1.25rem, 3.2vw, 2rem)/1.2 "Michroma", sans-serif; letter-spacing: .02em; }
    .core p { margin: .75rem 0 0; color: var(--dim); font-size: .9375rem; }
    .orbit { position: absolute; inset: 0; list-style: none; margin: 0; padding: 0; animation: spin 60s linear infinite; }
    .orbit li { position: absolute; left: 50%; top: 50%; transform: rotate(var(--a)) translate(var(--r)) rotate(calc(-1 * var(--a))); }
    .orbit a { display: block; translate: -50% -50%; padding: .35rem .8rem; border: 1px solid var(--cyan); border-radius: 999px; background: var(--navy); color: var(--fog); text-decoration: none; white-space: nowrap; animation: spin 60s linear infinite reverse; }
    .orbit a:hover, .orbit a:focus-visible { background: var(--cyan); color: var(--navy); outline: none; }
    .system:hover .orbit, .system:hover .orbit a, .system:focus-within .orbit, .system:focus-within .orbit a { animation-play-state: paused; }
    @keyframes spin { to { rotate: 360deg; } }
    footer { position: fixed; left: 0; right: 0; bottom: 4.5rem; text-align: center; color: var(--dim); font-size: .875rem; }
    canvas { position: fixed; inset: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { .orbit, .orbit a { animation: none; } }
  </style>
</head>
<body>
  <canvas id="warp" aria-hidden="true"></canvas>
  <div class="system">
    <div class="ring"></div><div class="ring"></div>
    <div class="core">
      <h1>Aymene Bourafai</h1>
      <p>Product engineer. Designing how developers and AI agents work together.</p>
    </div>
    <ul class="orbit">
      <li style="--a: -90deg"><a href="#">Writing</a></li>
      <li style="--a: 30deg"><a href="https://github.com/bourafai">GitHub</a></li>
      <li style="--a: 150deg"><a href="https://www.linkedin.com/in/bourafai">LinkedIn</a></li>
    </ul>
  </div>
  <footer>Type the word "warp" anywhere.</footer>
  <script>
    // Easter egg: typing "warp" launches a 3-second hyperspace jump on a canvas.
    let typed = '';
    addEventListener('keydown', (e) => {
      typed = (typed + e.key.toLowerCase()).slice(-4);
      if (typed === 'warp' && !matchMedia('(prefers-reduced-motion: reduce)').matches) warp();
    });
    function warp() {
      const c = document.getElementById('warp');
      const ctx = c.getContext('2d');
      c.width = innerWidth; c.height = innerHeight;
      const cx = c.width / 2, cy = c.height / 2;
      const stars = Array.from({ length: 400 }, () => ({ a: Math.random() * Math.PI * 2, d: Math.random() * 40, v: 2 + Math.random() * 6 }));
      const start = performance.now();
      (function frame(now) {
        const t = (now - start) / 3000;
        ctx.fillStyle = 'rgba(16, 35, 58, .35)';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.strokeStyle = '#5fd4e2';
        for (const s of stars) {
          const d0 = s.d;
          s.d += s.v * (1 + t * 12);
          ctx.beginPath();
          ctx.moveTo(cx + Math.cos(s.a) * d0, cy + Math.sin(s.a) * d0);
          ctx.lineTo(cx + Math.cos(s.a) * s.d, cy + Math.sin(s.a) * s.d);
          ctx.stroke();
          if (s.d > Math.hypot(cx, cy)) s.d = Math.random() * 20;
        }
        if (t < 1) requestAnimationFrame(frame);
        else ctx.clearRect(0, 0, c.width, c.height);
      })(start);
    }
  </script>
  <script src="switcher.js"></script>
</body>
</html>
